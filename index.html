@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#160b06}}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.1;margin:0}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
nav{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;gap:12px;background:var(--bg)}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:600;text-decoration:none}
.nr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.nr a.l{text-decoration:none;color:var(--ink);padding:6px 8px;font-size:.95rem}
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font-weight:500}
.btn.p{background:var(--ember);border-color:var(--ember);color:#1b0d05}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mut);padding:6px 10px;font-size:.85rem}
.lang button[aria-pressed=true]{background:var(--ink);color:#1b0d05}
.hero{aspect-ratio:16/9;background:var(--img) center/100% 100% no-repeat;position:relative}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:5%;background:linear-gradient(transparent,var(--bg))}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.welcome{padding:56px 0 40px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:start}
.welcome h2{font-size:clamp(2rem,5vw,3.2rem)}
.welcome p{color:var(--mut);max-width:60ch;margin:16px 0 0}
.acc{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:24px}
.acc h3{font-size:1.5rem;margin-bottom:6px}.acc p{margin:0 0 16px;font-size:.95rem}
.acc .row{display:flex;gap:10px;flex-wrap:wrap}
.gal{padding:24px 0 72px}
.gh{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.gh h2{font-size:clamp(1.8rem,4vw,2.6rem)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{background:none;border:1px solid var(--line);color:var(--mut);padding:6px 14px;border-radius:999px;font-size:.9rem}
.filters button[aria-pressed=true]{border-color:var(--ember);color:var(--ink);background:#f08a2c22}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:none;border:0;padding:0;text-align:left;color:inherit}
.ph{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--img);background-repeat:no-repeat;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

.card h3{font-size:1.35rem;margin-top:10px}
.card small{color:var(--mut)}
.note{color:var(--mut);font-size:.85rem;margin-top:20px}
.sec{padding:64px 0;border-top:1px solid var(--line)}.sec>h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:20px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.box{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:22px}.box h3{font-size:1.4rem;margin-bottom:6px}.box p{margin:0 0 12px;color:var(--mut)}.av{width:64px;height:64px;border-radius:50%;background:var(--ember);color:#1b0d05;display:grid;place-items:center;font:600 1.8rem 'Cormorant Garamond',serif;margin-bottom:12px}.sec ol{margin:0 0 24px;padding-left:20px;color:var(--mut)}.sec ol li{margin:6px 0}
footer{border-top:1px solid var(--line);padding:28px 20px;text-align:center;color:var(--mut);font-size:.9rem}
dialog{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:16px;padding:0;width:min(560px,92vw);max-height:92vh}
dialog::backdrop{background:#000a}
.db{padding:24px;position:relative}
.x{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--ink);font-size:1.6rem}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid var(--line);color:var(--mut);padding:8px}
.tabs button[aria-selected=true]{border-color:var(--ember);color:var(--ink)}
label{display:block;font-size:.9rem;margin:12px 0 4px;color:var(--mut)}
input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.msg{margin-top:14px;color:var(--ember);font-size:.92rem;min-height:1.3em}
.big{aspect-ratio:4/3;border-radius:10px;margin-bottom:16px}
.meta{color:var(--mut);font-size:.92rem;margin:4px 0 12px}
@media(max-width:760px){.welcome{grid-template-columns:1fr;gap:28px}nav{flex-wrap:wrap}.nr a.l{padding:4px 6px;font-size:.82rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
[hidden]{display:none!important}.cl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.thr{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px}.m{max-width:88%;padding:8px 12px;border-radius:12px;background:var(--surf);border:1px solid var(--line)}.m.me{align-self:flex-end;background:#f08a2c33}.m div{font-size:.9rem;color:var(--mut)}.m .btn{margin-top:8px}.ri{display:flex;gap:8px;margin-top:10px}.ri input{flex:1}#adm .box{margin:8px 0;font-size:.9rem}#adm h3{margin:18px 0 6px}.ph{background:none;aspect-ratio:auto}.ph img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}.grid{align-items:start}#photo{width:min(900px,96vw)}.ph.big{margin-bottom:16px}</style></head><body>

<p style="max-width:60ch;color:var(--mut);margin:0" data-fr="Tantara Tany est une galerie où les photographes sont reconnus comme des artistes. Chaque photo porte le nom de son auteur et raconte un lieu, une tradition, un regard sur Madagascar." data-en="Tantara Tany is a gallery where photographers are recognized as artists. Every photo carries its author's name and tells of a place, a tradition, a view of Madagascar."></p></section>
<section class="sec" id="licences"><h2 data-fr="Licences et contact" data-en="Licenses & contact"></h2>
<ol><li data-fr="Écrivez-nous depuis la fiche d'une photo pour discuter du prix." data-en="Message us from a photo page to discuss the price."></li><li data-fr="Vous recevez une facture dans la discussion." data-en="You receive an invoice in the conversation."></li><li data-fr="Payez par MVola (Madagascar) ou Taptap Send (international)." data-en="Pay by MVola (Madagascar) or Taptap Send (international)."></li><li data-fr="Après confirmation du paiement, vous recevez la photo en haute qualité par e-mail." data-en="Once payment is confirmed, you receive the full-quality photo by email."></li></ol>
<div class="cols"><div class="box"><h3 data-fr="Usage personnel" data-en="Personal use"></h3><p data-fr="Impression, décoration, partage non commercial. Le nom de l'auteur reste crédité." data-en="Printing, decor, non-commercial sharing. The author stays credited."></p></div><div class="box"><h3 data-fr="Usage commercial" data-en="Commercial use"></h3><p data-fr="Site web, publicité, produits, publication. Précisé dans la facture." data-en="Website, advertising, products, publishing. Stated in the invoice."></p></div><div class="box"><h3 data-fr="Contact" data-en="Contact"></h3><p data-fr="Une question, ou une photo à signaler ? Écrivez-nous." data-en="A question, or a photo to report? Write to us."></p><button class="btn p" data-soon data-fr="Nous écrire" data-en="Write to us"></button><div class="msg" role="status"></div></div></div></section>
</main>
<footer data-fr="© Tantara Tany · Paysages culturels de Madagascar" data-en="© Tantara Tany · Cultural landscapes of Madagascar"></footer>

<dialog id="auth"><div class="db">
 <button class="x" data-close aria-label="Fermer">×</button>
 <div class="tabs" role="tablist"><button role="tab" data-tab="signup" data-fr="Créer un compte" data-en="Create an account"></button><button role="tab" data-tab="login" data-fr="Connexion" data-en="Log in"></button></div>
 <div id="f-name"><label for="n" data-fr="Nom complet" data-en="Full name"></label><input id="n" autocomplete="name"></div>
 <label for="e" data-fr="E-mail" data-en="Email"></label><input id="e" type="email" autocomplete="email">
 <label for="p" data-fr="Mot de passe" data-en="Password"></label><input id="p" type="password" autocomplete="current-password">

 <div class="msg" id="amsg" role="status"></div>
</div></dialog>

<dialog id="photo"><div class="db">
 <button class="x" data-close aria-label="Fermer">×</button>
 <div class="ph big" id="pbig"></div>
 <h3 id="pt" style="font-size:1.8rem"></h3>
 <div class="meta" id="pm"></div>
 <p id="pd" style="margin:0 0 14px"></p>
 <p class="meta" data-fr="À partir de 10 $ · le prix final se négocie dans la messagerie." data-en="From $10 · the final price is negotiated in the messaging."></p>
 <button class="btn p" id="contact"></button>
 <div class="msg" id="pmsg" role="status"></div>
</div></dialog>

<dialog id="msgs" style="width:min(760px,94vw)"><div class="db"><button class="x" data-close aria-label="Fermer">×</button><h3 data-fr="Messages" data-en="Messages"></h3>
<div class="cl" id="clist"></div><div class="thr" id="thread" hidden></div>
<div id="mbox" hidden><div class="ri"><input id="mtxt" maxlength="2000"><button class="btn p" id="send" data-fr="Envoyer" data-en="Send"></button></div>
<div id="inv" hidden><label for="iamt">Prix convenu en $ (minimum 10)</label><div class="ri"><input id="iamt" type="number" min="10" step="0.01"><button class="btn" id="mkinv">Envoyer la facture</button></div><div class="msg" id="imsg"></div></div></div></div></dialog>
<dialog id="adm" style="width:min(760px,94vw)"><div class="db"><button class="x" data-close aria-label="Fermer">×</button><h3>Ajouter une photo</h3>
<label for="at_fr">Titre (FR)</label><input id="at_fr"><label for="at_en">Titre (EN)</label><input id="at_en"><label for="al">Lieu</label><input id="al"><label for="ar">Région ou thème</label><input id="ar"><label for="ad_fr">Description (FR)</label><input id="ad_fr"><label for="ad_en">Description (EN)</label><input id="ad_en"><label for="aa">Photographe</label><input id="aa" value="Tantara Tany"><label for="af">Photo originale</label><input id="af" type="file" accept="image/*">
<p><button class="btn p" id="aup">Publier</button></p><div class="msg" id="amsg2" role="status"></div><h3>Photos publiées</h3><div class="msg" id="plmsg" role="status"></div><div id="plist"></div><h3>Commandes</h3><div id="olist"></div></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== CONFIGURATION : à remplir (voir GUIDE.md) ======
const CFG={url:'https://qnurvikhtttmjshufyeo.supabase.co',key:'sb_publishable_4YcsOCuqtlQ5bAe8Rpmqtw_NAE7qGH8',mvola:'+261 38 53 949 11 (Fitahiana Rahivoson)'};
// =======================================================
const sb=CFG.url.startsWith('VOTRE')?null:supabase.createClient(CFG.url,CFG.key);
let L='fr',user=null,prof=null,P=[],cur='all',mode='login',cp=null,cv=null,convs=[],timer=null;
const $=id=>document.getElementById(id),t=(f,e)=>L==='fr'?f:e,isAdm=()=>prof&&prof.role==='admin';
const prevUrl=p=>sb.storage.from('previews').getPublicUrl(p.preview_path).data.publicUrl;
const bg=(el,p)=>{el.style.background='none';el.innerHTML='<img alt="" draggable="false">';el.firstChild.src=prevUrl(p)};
function render(){
 document.documentElement.lang=L;
 document.querySelectorAll('[data-fr]').forEach(e=>e.textContent=e.getAttribute('data-'+L));
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
 nav();setAuth();gallery();
}
function nav(){
 $('bauth').textContent=user?t('Déconnexion','Log out'):t('Connexion','Log in');
 $('bmsg').hidden=!user;$('badm').hidden=!isAdm();$('acc').hidden=!!user;
 $('contact').textContent=t('Contacter pour acheter','Message us to buy');
}
function gallery(){
 const regs=[...new Set(P.map(p=>p.region).filter(Boolean))],f=$('filters'),g=$('grid');
 f.innerHTML='';g.innerHTML='';
 [['all',t('Tout','All')]].concat(regs.map(r=>[r,r])).forEach(x=>{
  const b=document.createElement('button');b.textContent=x[1];b.setAttribute('aria-pressed',cur===x[0]);
  b.onclick=()=>{cur=x[0];gallery()};f.appendChild(b)});
 if(!P.length)g.textContent=sb?t('Les premières photos arrivent bientôt.','The first photos are coming soon.'):'Site non configuré : voir GUIDE.md';
 P.filter(p=>cur==='all'||p.region===cur).forEach(p=>{
  const c=document.createElement('button');c.className='card';c.innerHTML='<div class="ph"></div><h3></h3><small></small>';
  bg(c.firstChild,p);c.querySelector('h3').textContent=p['title_'+L]||p.title_fr;
  c.querySelector('small').textContent=[p.location,p.artist].filter(Boolean).join(' · ');
  c.onclick=()=>openPhoto(p);g.appendChild(c)});
}
async function loadPhotos(){if(!sb)return;const r=await sb.from('photos').select('*').order('created_at',{ascending:false});P=(r.data||[]).filter(p=>p.status==='published');gallery()}
function openPhoto(p){cp=p;bg($('pbig'),p);$('pt').textContent=p['title_'+L]||p.title_fr;
 $('pm').textContent=[p.location,'© '+(p.artist||'Tantara Tany')].filter(Boolean).join(' · ');
 $('pd').textContent=p['desc_'+L]||p.desc_fr||'';$('pmsg').textContent='';$('photo').showModal()}
function setAuth(){const s=mode==='signup';
 document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===mode));
 $('f-name').style.display=s?'block':'none';
 $('go').textContent=s?t('Créer mon compte','Create my account'):t('Me connecter','Log in')}
async function loadProf(){prof=null;if(user){const r=await sb.from('profiles').select('*').eq('id',user.id).single();prof=r.data}nav()}
if(sb){sb.auth.onAuthStateChange((_,s)=>{user=s?s.user:null;setTimeout(loadProf,0)});
 sb.auth.getSession().then(r=>{if(r.data.session){user=r.data.session.user;loadProf()}})}
$('go').onclick=async()=>{
 const m=$('amsg');m.textContent='';if(!sb){m.textContent='Site non configuré.';return}
 const e=$('e').value.trim(),p=$('p').value;
 const r=mode==='signup'?await sb.auth.signUp({email:e,password:p,options:{data:{name:$('n').value.trim()}}}):await sb.auth.signInWithPassword({email:e,password:p});
 if(r.error){m.textContent=r.error.message;return}
 if(mode==='signup'&&!r.data.session){m.textContent=t('Vérifiez votre e-mail pour confirmer le compte.','Check your email to confirm your account.');return}
 $('auth').close()};
$('bauth').onclick=()=>{if(user)sb.auth.signOut();else{mode='login';setAuth();$('auth').showModal()}};
$('contact').onclick=async()=>{
 if(!user){mode='login';setAuth();$('photo').close();$('auth').showModal();return}
 let r=await sb.from('conversations').select('id').eq('client_id',user.id).eq('photo_id',cp.id).maybeSingle();
 let id=r.data&&r.data.id;
 if(!id){r=await sb.from('conversations').insert({client_id:user.id,photo_id:cp.id}).select('id').single();
  if(r.error){$('pmsg').textContent=r.error.message;return}id=r.data.id}
 $('photo').close();openMsgs(id)};
async function openMsgs(id){$('msgs').showModal();await loadConvs();if(id)pick(id)}
async function loadConvs(){
 const r=await sb.from('conversations').select('id,client_id,photo_id,photos(title_fr,title_en),profiles(name)').order('created_at',{ascending:false});
 convs=r.data||[];const c=$('clist');c.innerHTML='';
 if(!convs.length)c.textContent=t('Aucune discussion.','No conversations.');
 convs.forEach(v=>{const b=document.createElement('button');b.className='btn';
  b.textContent=(isAdm()?((v.profiles&&v.profiles.name)||'Client')+' · ':'')+v.photos['title_'+L];b.onclick=()=>pick(v.id);c.appendChild(b)})}
function pick(id){cv=id;$('thread').hidden=false;$('mbox').hidden=false;$('inv').hidden=!isAdm();loadThread();clearInterval(timer);timer=setInterval(loadThread,6000)}
$('msgs').addEventListener('close',()=>{clearInterval(timer);cv=null});
async function loadThread(){
 if(!cv)return;
 const[m,o]=await Promise.all([sb.from('messages').select('*').eq('conv_id',cv).order('created_at'),sb.from('orders').select('*,photos(original_path)').eq('conv_id',cv)]);
 const th=$('thread'),om={};th.innerHTML='';(o.data||[]).forEach(x=>om[x.id]=x);
 (m.data||[]).forEach(x=>{
  const d=document.createElement('div');d.className='m '+(x.sender_id===user.id?'me':'them');
  if(x.invoice){const iv=x.invoice,od=om[iv.order_id]||{},mk=s=>{const e=document.createElement('div');e.textContent=s;return e};
   const h=document.createElement('strong');h.textContent=t('Facture','Invoice')+' · '+iv.title;
   d.append(h,mk(t('Prix convenu : ','Agreed price: ')+iv.price+' $'),mk(t('Montant exact à envoyer : ','Exact amount to send: ')+iv.pay_amount+' $'),
    mk(t('Madagascar : MVola au ','Madagascar: MVola to ')+CFG.mvola+t(' · International : Taptap Send vers ce numéro MVola.',' · International: Taptap Send to this MVola number.')));
   if(od.status==='paid'){const b=document.createElement('button');b.className='btn p';b.textContent=t('Télécharger la photo','Download the photo');
    b.onclick=async()=>{const r=await sb.storage.from('originals').createSignedUrl(od.photos.original_path,120,{download:true});
     if(r.data)location.href=r.data.signedUrl;else alert(r.error.message)};d.append(b)}
   else d.append(mk(t('En attente de paiement','Awaiting payment')))}
  else d.textContent=x.body;
  th.appendChild(d)});
 th.scrollTop=th.scrollHeight}
$('send').onclick=async()=>{const v=$('mtxt').value.trim();if(!v||!cv)return;$('mtxt').value='';
 await sb.from('messages').insert({conv_id:cv,body:v});loadThread()};
$('mkinv').onclick=async()=>{
 const price=parseFloat($('iamt').value),c=convs.find(x=>x.id===cv),m=$('imsg');
 if(!(price>=10)){m.textContent='Le prix minimum est 10 $.';return}
 const pay=+(price+(Math.floor(Math.random()*98)+1)/100).toFixed(2);
 const o=await sb.from('orders').insert({conv_id:cv,photo_id:c.photo_id,client_id:c.client_id,price,pay_amount:pay}).select().single();
 if(o.error){m.textContent=o.error.message;return}
 await sb.from('messages').insert({conv_id:cv,invoice:{order_id:o.data.id,price,pay_amount:pay,title:c.photos.title_fr}});
 $('iamt').value='';m.textContent='';loadThread()};
// ---- Administration ----
async function mkPreview(f){
 const im=await createImageBitmap(f),s=Math.min(1,4096/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
 const x=c.getContext('2d'),fs=Math.max(16,c.width/26),d=Math.hypot(c.width,c.height);
 x.drawImage(im,0,0,c.width,c.height);x.fillStyle='rgba(255,255,255,.22)';x.font='600 '+Math.max(18,c.width/16)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';
 [[.5,.5],[.2,.2],[.8,.8]].forEach(p=>{x.save();x.translate(c.width*p[0],c.height*p[1]);x.rotate(-.42);x.fillText('© Tantara Tany',0,0);x.restore()});
 return new Promise(r=>c.toBlob(r,'image/jpeg',.92))}
$('aup').onclick=async()=>{
 const f=$('af').files[0],m=$('amsg2'),v=i=>$(i).value.trim();
 if(!f||!v('at_fr')){m.textContent='Titre et photo requis.';return}
 m.textContent='Envoi en cours…';
 const id=crypto.randomUUID(),ext=(f.name.split('.').pop()||'jpg').toLowerCase();
 const a=await sb.storage.from('previews').upload(id+'.jpg',await mkPreview(f),{contentType:'image/jpeg'});
 const b=await sb.storage.from('originals').upload(id+'.'+ext,f);
 if(a.error||b.error){m.textContent=(a.error||b.error).message;return}
 const r=await sb.from('photos').insert({title_fr:v('at_fr'),title_en:v('at_en')||v('at_fr'),location:v('al'),region:v('ar'),desc_fr:v('ad_fr'),desc_en:v('ad_en'),artist:v('aa'),preview_path:id+'.jpg',original_path:id+'.'+ext});
 if(r.error){m.textContent=r.error.message;return}
 m.textContent='Photo publiée.';['at_fr','at_en','al','ar','ad_fr','ad_en','af'].forEach(i=>$(i).value='');loadPhotos().then(listPhotos)};
function listPhotos(){
 const l=$('plist');l.innerHTML='';
 P.forEach(p=>{const d=document.createElement('div');d.className='box';d.textContent=p.title_fr+' ';
  const f=document.createElement('input');f.type='file';f.accept='image/*';f.hidden=true;f.onchange=()=>replacePhoto(p,f.files[0]);
  const r=document.createElement('button');r.className='btn';r.textContent="Remplacer l'image";r.onclick=()=>f.click();
  const x=document.createElement('button');x.className='btn';x.textContent='Supprimer';x.onclick=()=>deletePhoto(p);
  d.append(f,r,' ',x);l.appendChild(d)})}
async function replacePhoto(p,f){
 if(!f)return;const m=$('plmsg');m.textContent='Remplacement en cours…';
 const id=crypto.randomUUID(),ext=(f.name.split('.').pop()||'jpg').toLowerCase();
 const a=await sb.storage.from('previews').upload(id+'.jpg',await mkPreview(f),{contentType:'image/jpeg'});
 const b=await sb.storage.from('originals').upload(id+'.'+ext,f);
 if(a.error||b.error){m.textContent=(a.error||b.error).message;return}
 const r=await sb.from('photos').update({preview_path:id+'.jpg',original_path:id+'.'+ext}).eq('id',p.id);
 if(r.error){m.textContent=r.error.message;return}
 await sb.storage.from('previews').remove([p.preview_path]);await sb.storage.from('originals').remove([p.original_path]);
 m.textContent='Image remplacée.';await loadPhotos();listPhotos()}
async function deletePhoto(p){
 if(!confirm('Supprimer « '+p.title_fr+' » ?'))return;const m=$('plmsg');
 const r=await sb.from('photos').delete().eq('id',p.id);
 if(r.error){await sb.from('photos').update({status:'hidden'}).eq('id',p.id);m.textContent='Cette photo a des discussions ou des commandes : elle est masquée, pas supprimée.'}
 else{await sb.storage.from('previews').remove([p.preview_path]);await sb.storage.from('originals').remove([p.original_path]);m.textContent='Photo supprimée.'}
 await loadPhotos();listPhotos()}
async function loadOrders(){
 const r=await sb.from('orders').select('*,photos(title_fr),profiles(name)').order('created_at',{ascending:false}),l=$('olist');l.innerHTML='';
 (r.data||[]).forEach(o=>{const d=document.createElement('div');d.className='box';
  d.textContent=((o.profiles&&o.profiles.name)||'Client')+' · '+o.photos.title_fr+' · '+o.price+' $ (montant à recevoir : '+o.pay_amount+' $) · '+(o.status==='paid'?'PAYÉ':'En attente')+' · Photographe '+(o.price*.85).toFixed(2)+' $ / Site '+(o.price*.15).toFixed(2)+' $ · Reversement : '+(o.payout==='done'?'fait':'à faire');
  const up=(patch,lab)=>{const b=document.createElement('button');b.className='btn';b.textContent=lab;
   b.onclick=async()=>{await sb.from('orders').update(patch).eq('id',o.id);loadOrders()};d.append(' ',b)};
  if(o.status==='pending')up({status:'paid',paid_at:new Date().toISOString()},'Marquer payé');
  else if(o.payout==='todo')up({payout:'done'},'Reversement fait');
  l.appendChild(d)})}
$('badm').onclick=()=>{$('adm').showModal();loadOrders();listPhotos()};
$('bmsg').onclick=()=>openMsgs();
// ---- Interface ----
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;render()});
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{mode=b.dataset.open;setAuth();$('amsg').textContent='';$('auth').showModal()});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{mode=b.dataset.tab;setAuth()});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
document.querySelectorAll('[data-soon]').forEach(b=>b.onclick=()=>{b.nextElementSibling.textContent=t('Écrivez-nous depuis la fiche d\'une photo, après connexion.','Message us from a photo page, after logging in.')});
['contextmenu','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('.ph,.card'))e.preventDefault()}));
render();loadPhotos();
</script></body></html>
